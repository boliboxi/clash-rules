# 3x-ui Global Routing Rules remote fragment.
# Do not add proxies:, mixed-port, mode, or tun: here.
proxy-groups:
  - name: PROXY-OUT
    type: select
    include-all: true
  - name: '🤖 AI'
    type: select
    proxies: [ PROXY-OUT]
  - name: '🌍 Global'
    type: select
    proxies: [PROXY-OUT]
  - name: '🎬 Media'
    type: select
    proxies: [PROXY-OUT]
  - name: '🍎 Apple'
    type: select
    proxies: [DIRECT, PROXY-OUT]

rule-providers:
  OpenAI:
    type: http
    behavior: domain
    format: mrs
    path: ./rules/OpenAI-Site.mrs
    url: https://cdn.jsdmirror.com/gh/HosheaPDNX/rule-set@V2.0.0/mihomo/OpenAI/OpenAI-Site.mrs
    interval: 86400
    proxy: PROXY-OUT
  
  Claude:
    type: http
    behavior: classical
    format: yaml
    path: ./rules/Claude.yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Claude/Claude.yaml
    interval: 86400
    proxy: PROXY-OUT
  
  GitHub:
    type: http
    behavior: classical
    format: yaml
    path: ./rules/GitHub.yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/GitHub/GitHub.yaml
    interval: 86400
    proxy: PROXY-OUT
  
  YouTube:
    type: http
    behavior: classical
    format: yaml
    path: ./rules/YouTube.yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/YouTube/YouTube.yaml
    interval: 86400
    proxy: PROXY-OUT
  
  Telegram:
    type: http
    behavior: domain
    format: mrs
    path: ./rules/Telegram-Site.mrs
    url: https://cdn.jsdmirror.com/gh/HosheaPDNX/rule-set@V2.0.0/mihomo/Telegram/Telegram-Site.mrs
    interval: 86400
    proxy: PROXY-OUT
  
  
  Discord-Site:
    type: http
    behavior: domain
    format: mrs
    url: https://cdn.jsdmirror.com/gh/HosheaPDNX/rule-set@V2.0.0/mihomo/Discord/Discord-Site.mrs
    path: ./ruleset/Discord-Site.mrs
    interval: 86400
    proxy: PROXY-OUT

  Netflix-Site:
    type: http
    behavior: domain
    format: mrs
    url: https://cdn.jsdmirror.com/gh/HosheaPDNX/rule-set@V2.0.0/mihomo/Netflix/Netflix-Site.mrs
    path: ./ruleset/Netflix-Site.mrs
    interval: 86400
    proxy: PROXY-OUT

  TikTok-Site:
    type: http
    behavior: domain
    format: mrs
    url: https://cdn.jsdmirror.com/gh/HosheaPDNX/rule-set@V2.0.0/mihomo/TikTok/TikTok-Site.mrs
    path: ./ruleset/TikTok-Site.mrs
    interval: 86400
    proxy: PROXY-OUT
  
  Bilibili-Site:
    type: http
    behavior: domain
    format: mrs
    url: 'https://cdn.jsdmirror.com/gh/HosheaPDNX/rule-set@V2.0.0/mihomo/Bilibili/Bilibili-Site.mrs'
    path: ./ruleset/Bilibili-Site.mrs
    proxy: DIRECT
    interval: 86400
  
  Bilibili-IP:
    type: http
    behavior: ipcidr
    format: mrs
    url: 'https://cdn.jsdmirror.com/gh/HosheaPDNX/rule-set@V2.0.0/mihomo/Bilibili/Bilibili-IP.mrs'
    path: ./ruleset/Bilibili-IP.mrs
    proxy: DIRECT
    interval: 86400
  
  
  Google-Site:
    type: http
    behavior: domain
    format: mrs
    url: 'https://cdn.jsdmirror.com/gh/HosheaPDNX/rule-set@V2.0.0/mihomo/Google/Google-Site.mrs'
    path: ./ruleset/Google-Site.mrs
    interval: 86400
    proxy: PROXY-OUT
  
  
  GoogleFCM-Site:
    type: http
    behavior: domain
    format: mrs
    url: 'https://cdn.jsdmirror.com/gh/HosheaPDNX/rule-set@V2.0.0/mihomo/GoogleFCM/GoogleFCM-Site.mrs'
    path: ./ruleset/GoogleFCM-Site.mrs
    interval: 86400
    proxy: PROXY-OUT

rules:
  # OpenAI / ChatGPT
  - DOMAIN-SUFFIX,chatgpt.com,🤖 AI
  - DOMAIN-SUFFIX,openai.com,🤖 AI
  - DOMAIN-SUFFIX,oaistatic.com,🤖 AI
  - DOMAIN-SUFFIX,oaiusercontent.com,🤖 AI
  - RULE-SET,OpenAI,🤖 AI
  # Claude
  - DOMAIN-SUFFIX,claude.ai,🤖 AI
  - DOMAIN-SUFFIX,anthropic.com,🤖 AI
  - DOMAIN-SUFFIX,claudeusercontent.com,🤖 AI
  - RULE-SET,Claude,🤖 AI
  # Gemini / Google AI before general Google rules
  - DOMAIN,gemini.google.com,🤖 AI
  - DOMAIN,aistudio.google.com,🤖 AI
  - DOMAIN,ai.google.dev,🤖 AI
  - DOMAIN,generativelanguage.googleapis.com,🤖 AI
  - DOMAIN,makersuite.google.com,🤖 AI
  # Perplexity AI
  - DOMAIN-SUFFIX,perplexity.ai,🤖 AI
  - DOMAIN-SUFFIX,pplx.ai,🤖 AI
  # Microsoft Copilot
  - DOMAIN-SUFFIX,copilot.microsoft.com,🤖 AI
  # GitHub Copilot
  - DOMAIN-SUFFIX,githubcopilot.com,🤖 AI
  - DOMAIN-SUFFIX,copilot.githubusercontent.com,🤖 AI
  - DOMAIN,copilot-proxy.githubusercontent.com,🤖 AI
  - DOMAIN,api.githubcopilot.com,🤖 AI
  # Cursor AI
  - DOMAIN-SUFFIX,cursor.com,🤖 AI
  - DOMAIN-SUFFIX,cursor.sh,🤖 AI
  - DOMAIN-SUFFIX,cursorapi.com,🤖 AI
  # DNS / IP Leak Test 强制代理
  - DOMAIN-SUFFIX,browserleaks.com,🌍 Global
  - DOMAIN-SUFFIX,dnsleaktest.com,🌍 Global
  - DOMAIN-SUFFIX,ipleak.net,🌍 Global
  - DOMAIN-SUFFIX,whoer.net,🌍 Global
  - DOMAIN-SUFFIX,ipinfo.io,🌍 Global
  - DOMAIN-SUFFIX,ipify.org,🌍 Global
  - DOMAIN-SUFFIX,ip.sb,🌍 Global
  # Other international services
  - RULE-SET,GitHub,🌍 Global
  - RULE-SET,YouTube,🎬 Media
  - RULE-SET,Telegram,🌍 Global
  - RULE-SET,GoogleFCM-Site,🌍 Global
  - DOMAIN-SUFFIX,googleapis.com,🌍 Global
  - RULE-SET,Google-Site,🌍 Global
  # 新增国际服务分流
  - RULE-SET,Discord-Site,🌍 Global
  - RULE-SET,Netflix-Site,🎬 Media
  - RULE-SET,TikTok-Site,🎬 Media
  # Bilibili 国内直连
  - RULE-SET,Bilibili-Site,DIRECT
  - RULE-SET,Bilibili-IP,DIRECT,no-resolve
  # Apple services: direct by default; can be switched in the Apple group
  - DOMAIN-SUFFIX,apple.com,🍎 Apple
  - DOMAIN-SUFFIX,icloud.com,🍎 Apple
  - DOMAIN-SUFFIX,icloud-content.com,🍎 Apple
  - DOMAIN-SUFFIX,mzstatic.com,🍎 Apple
  - DOMAIN-SUFFIX,apple-cloudkit.com,🍎 Apple
  # Mainland China direct
  # Private and local network direct
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  - GEOSITE,CN,DIRECT
  - GEOIP,CN,DIRECT,no-resolve
  - MATCH,🌍 Global
